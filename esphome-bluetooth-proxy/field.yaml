# Field ESP32-C3 at the hobocamp, running as a pure ESPHome Bluetooth
# Proxy - same role as bench.yaml, just the actual deployed unit next to
# the real EcoWorthy BW0F. No on-device BLE parsing; see ../app/.
#
# The initial flash MUST be done over USB (this device is not currently
# running ESPHome - it's on the old hand-rolled Arduino/PlatformIO
# firmware, which uses a different partition layout, so there is no
# network-based upgrade path for that first flash). Every flash after
# that can go over OTA/WiFi like any other ESPHome device:
#   pip install esphome
#   cp secrets.yaml.example secrets.yaml   # fill in real values (if not already done)
#   esphome run field.yaml --device COM7          # first time only, on site
#   esphome run field.yaml --device 192.168.2.4   # every time after that

esphome:
  name: hobocamp-bw0f-field
  friendly_name: Hobocamp BW0F Field

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

api:
  encryption:
    key: !secret field_api_encryption_key

ota:
  - platform: esphome
    password: !secret field_ota_password

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: !secret field_static_ip
    gateway: !secret gateway
    subnet: !secret subnet

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true
  connection_slots: 3
