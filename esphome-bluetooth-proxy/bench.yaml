# Bench ESP32-C3, running as a pure ESPHome Bluetooth Proxy - no on-device
# BLE parsing at all. All "brains" (connect to a device, discover its GATT
# services/characteristics, subscribe to notify, read raw bytes) live in a
# custom server using aioesphomeapi to talk to this device's native API -
# see ../app/. This device just relays.
#
# Deploy:
#   pip install esphome
#   cp secrets.yaml.example secrets.yaml   # fill in real values
#   esphome run bench.yaml --device COM7

esphome:
  name: hobocamp-bw0f-bench
  friendly_name: Hobocamp BW0F Bench

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Native API only - no web_server, no human-facing anything. The server
# (using aioesphomeapi) is the only intended client, and it always
# initiates the connection to this device, never the other way around.
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  # USB serial only for bench debugging - the native API's own log
  # streaming isn't needed since aioesphomeapi is what actually consumes
  # this device, not a human watching logs.
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # This network's SSID doesn't broadcast (matches the field deployment's
  # hidden-SSID hobocamp network) - fine, ESP32 associates directly by
  # name regardless of whether it's broadcast.
  fast_connect: true
  manual_ip:
    static_ip: !secret static_ip
    gateway: !secret gateway
    subnet: !secret subnet
  # Confirmed this session on the custom-firmware build: modem sleep adds
  # multi-second latency to inbound traffic even on a strong link, and
  # separately, this chip's precompiled WiFi/BLE coexistence library
  # crashed reproducibly when sleep was disabled right before BLE init on
  # our own firmware. ESPHome may sequence things differently, but keep
  # power_save_mode at its default (not explicitly disabled) here as a
  # starting point and revisit only if proxy responsiveness is actually a
  # problem in practice.

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true
  # Modest on purpose: each connection slot costs ~1KB RAM on a chip with
  # 320KB total, and ESPHome's own docs recommend staying well under the
  # hardware max (9) for stability - 3 is plenty to prove out the
  # single-target BW0F use case without pushing memory limits on a first
  # attempt.
  connection_slots: 3
