; PlatformIO project for the hobocamp EcoWorthy BW0F BLE logger.
; Board: ESP32-C3 with native USB-Serial-JTAG (VID 303A / PID 1001).

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
upload_port = COM5
monitor_port = COM5
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Same firmware, deployed over WiFi instead of USB. Use once the device is
; already running and reachable (e.g. deployed at the hobocamp).
; Set the OTA_PASSWORD env var first (must match OTA_PASSWORD in
; include/secrets.h) so the real password never lands in this file:
;   PowerShell: $env:OTA_PASSWORD = "..."
;   bash:       export OTA_PASSWORD="..."
; Usage: pio run -e esp32-c3-devkitm-1-ota -t upload
[env:esp32-c3-devkitm-1-ota]
extends = env:esp32-c3-devkitm-1
upload_protocol = espota
upload_port = 192.168.2.4
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
