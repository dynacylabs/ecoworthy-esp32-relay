; PlatformIO project for the hobocamp EcoWorthy BW0F BLE logger.
; Board: ESP32-C3 with native USB-Serial-JTAG (VID 303A / PID 1001).

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
upload_port = COM5
monitor_port = COM5
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ArduinoOTA (espota) support was removed from the firmware - it needs the
; device to open a fresh outbound connection back to the uploading machine,
; which proved unreliable in the field (VLAN routing and BLE/WiFi radio
; contention both got in the way). Use tools/push_update.py or
; tools/push_via_relay.sh instead - see discovery/README.md.
