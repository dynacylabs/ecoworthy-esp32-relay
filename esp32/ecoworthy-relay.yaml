substitutions:
  name: ecoworthy-esp32-relay
  friendly_name: EcoWorthy ESP32 Relay
  external_components_source: github://syssi/esphome-jbd-bms@main

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  # Change to your hardware model if needed (example: esp32-s3-devkitc-1)
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  power_save_mode: none
  ap:
    ssid: !secret fallback_ap_ssid
    password: !secret fallback_ap_password

captive_portal:

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  port: 80
  version: 3
  include_internal: true

time:
  - platform: sntp
    id: sntp_time

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - id: client0
    mac_address: !secret bms0_mac_address

jbd_bms_ble:
  - id: bms0
    ble_client_id: client0
    update_interval: 5s

globals:
  - id: successful_polls
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: last_update_epoch
    type: uint32_t
    restore_value: yes
    initial_value: '0'

script:
  - id: note_poll_success
    mode: restart
    then:
      - lambda: |-
          id(successful_polls) += 1;
          auto now = id(sntp_time).now();
          if (now.is_valid()) {
            id(last_update_epoch) = now.timestamp;
          }

sensor:
  - platform: jbd_bms_ble
    jbd_bms_ble_id: bms0
    battery_strings:
      id: raw_battery_strings
      internal: true
      on_value:
        then:
          - sensor.template.publish:
              id: cache_battery_strings
              state: !lambda "return x;"
    total_voltage:
      id: raw_total_voltage
      internal: true
      on_value:
        then:
          - sensor.template.publish:
              id: cache_total_voltage
              state: !lambda "return x;"
    current:
      id: raw_current
      internal: true
      on_value:
        then:
          - sensor.template.publish:
              id: cache_current
              state: !lambda "return x;"
    state_of_charge:
      id: raw_soc
      internal: true
      on_value:
        then:
          - sensor.template.publish:
              id: cache_soc
              state: !lambda "return x;"
          - script.execute: note_poll_success
    capacity_remaining:
      id: raw_capacity_remaining
      internal: true
      on_value:
        then:
          - sensor.template.publish:
              id: cache_capacity_remaining
              state: !lambda "return x;"
    nominal_capacity:
      id: raw_nominal_capacity
      internal: true
      on_value:
        then:
          - sensor.template.publish:
              id: cache_nominal_capacity
              state: !lambda "return x;"
    min_cell_voltage:
      id: raw_min_cell_voltage
      internal: true
      on_value:
        then:
          - sensor.template.publish:
              id: cache_min_cell_voltage
              state: !lambda "return x;"
    max_cell_voltage:
      id: raw_max_cell_voltage
      internal: true
      on_value:
        then:
          - sensor.template.publish:
              id: cache_max_cell_voltage
              state: !lambda "return x;"
    average_cell_voltage:
      id: raw_avg_cell_voltage
      internal: true
      on_value:
        then:
          - sensor.template.publish:
              id: cache_avg_cell_voltage
              state: !lambda "return x;"
    temperature_1:
      id: raw_temp_1
      internal: true
      on_value:
        then:
          - sensor.template.publish:
              id: cache_temp_1
              state: !lambda "return x;"
    temperature_2:
      id: raw_temp_2
      internal: true
      on_value:
        then:
          - sensor.template.publish:
              id: cache_temp_2
              state: !lambda "return x;"
    temperature_3:
