  - platform: template
    id: cache_successful_polls
    name: "cache_successful_polls"
    state_class: total_increasing
    accuracy_decimals: 0
    lambda: |-
      return id(successful_polls);
    update_interval: 5s

  - platform: template
    id: cache_last_update_epoch
    name: "cache_last_update_epoch"
    accuracy_decimals: 0
    lambda: |-
      return id(last_update_epoch);
    update_interval: 5s

text_sensor:
  - platform: jbd_bms_ble
    jbd_bms_ble_id: bms0
    device_model:
      id: raw_device_model
      internal: true
      on_value:
        then:
          - text_sensor.template.publish:
              id: cache_device_model
              state: !lambda "return x;"
    operation_status:
      id: raw_operation_status
      internal: true
      on_value:
        then:
          - text_sensor.template.publish:
              id: cache_operation_status
              state: !lambda "return x;"

  - platform: template
    id: cache_device_model
    name: "cache_device_model"
    update_interval: never

  - platform: template
    id: cache_operation_status
    name: "cache_operation_status"
    update_interval: never

  - platform: template
    id: cache_json
    name: "cache_json"
    update_interval: 5s
    lambda: |-
      char out[2048];
      snprintf(
        out,
        sizeof(out),
        "{\"source\":\"ecoworthy\",\"ok\":%s,\"last_update_epoch\":%u,\"successful_polls\":%u,\"battery_strings\":%.0f,\"total_voltage\":%.3f,\"current\":%.3f,\"soc\":%.2f,\"capacity_remaining\":%.3f,\"nominal_capacity\":%.3f,\"min_cell_voltage\":%.3f,\"max_cell_voltage\":%.3f,\"avg_cell_voltage\":%.3f,\"temp_1\":%.2f,\"temp_2\":%.2f,\"temp_3\":%.2f,\"temp_4\":%.2f,\"temp_5\":%.2f,\"cell_voltage_1\":%.3f,\"cell_voltage_2\":%.3f,\"cell_voltage_3\":%.3f,\"cell_voltage_4\":%.3f,\"cell_voltage_5\":%.3f,\"cell_voltage_6\":%.3f,\"cell_voltage_7\":%.3f,\"cell_voltage_8\":%.3f,\"operation_status\":\"%s\",\"device_model\":\"%s\"}",
        id(successful_polls) > 0 ? "true" : "false",
        id(last_update_epoch),
        id(successful_polls),
        id(cache_battery_strings).state,
        id(cache_total_voltage).state,
        id(cache_current).state,
        id(cache_soc).state,
        id(cache_capacity_remaining).state,
        id(cache_nominal_capacity).state,
        id(cache_min_cell_voltage).state,
        id(cache_max_cell_voltage).state,
        id(cache_avg_cell_voltage).state,
        id(cache_temp_1).state,
        id(cache_temp_2).state,
        id(cache_temp_3).state,
        id(cache_temp_4).state,
        id(cache_temp_5).state,
        id(cache_cell_voltage_1).state,
        id(cache_cell_voltage_2).state,
        id(cache_cell_voltage_3).state,
        id(cache_cell_voltage_4).state,
        id(cache_cell_voltage_5).state,
        id(cache_cell_voltage_6).state,
        id(cache_cell_voltage_7).state,
        id(cache_cell_voltage_8).state,
        id(cache_operation_status).state.c_str(),
        id(cache_device_model).state.c_str());
      return std::string(out);
