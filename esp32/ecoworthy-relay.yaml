              id: cache_cell_voltage_8
              state: !lambda "return x;"

  - platform: template
    id: cache_battery_strings
    name: "cache_battery_strings"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: cache_total_voltage
    name: "cache_total_voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    id: cache_current
    name: "cache_current"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    id: cache_soc
    name: "cache_soc"
    unit_of_measurement: "%"
