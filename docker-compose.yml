services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: victron
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: victron
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks:
      - internal

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      - timescaledb
    environment:
      DATABASE_URL: postgresql://victron:changeme@timescaledb:5432/victron
      API_TOKEN: changeme
      # Host/port of the ESPHome device running the victron_ble external
      # component (see esphome-victron-ble/). It does its own BLE
      # scanning/decryption on-device; the server connects out to it over
      # the native API to subscribe to the already-decoded sensor values -
      # the device never initiates anything back to us.
      ESPHOME_HOST: 192.168.2.4
      ESPHOME_PORT: "6053"
      ESPHOME_API_ENCRYPTION_KEY: changeme
      # MAC address of the Victron SmartSolar to poll for. Just a label
      # here - the actual MAC/bindkey pairing that decrypts its BLE
      # advertisements lives on the ESP32 (esphome-victron-ble/*.yaml).
      TARGET_BLE_MAC: "aa:bb:cc:dd:ee:ff"
      # Everything below (ntfy + alert thresholds + stall timing) is also
      # editable at runtime from the dashboard's Settings tab
      # (http://<host>:8080/settings) - these are just the defaults used
      # until something's overridden there. See app/settings.py.
      #
      # ntfy.sh push notifications for alert conditions (low voltage,
      # charger error, ESP32/BLE connection lost) - see app/alerts.py.
      # Leave NTFY_TOPIC blank to disable alerting entirely. Use a hard
      # to guess topic name (or your own ntfy instance) since anyone who
      # knows the topic can read these notifications.
      NTFY_URL: https://ntfy.sh
      NTFY_TOPIC: ""
      NTFY_AUTH_TOKEN: ""
      # Leave blank to disable that specific check. "Low" depends on the
      # pack's nominal voltage, so there's no sane default. The
      # charger_error check is always on when ntfy is configured - no
      # threshold needed for that one.
      ALERT_LOW_VOLTAGE_V: ""
      ALERT_COOLDOWN_SECONDS: "1800"
    volumes:
      # Read-only access to the migration files so app/migrate.py can
      # apply any not-yet-applied one on startup (see its module
      # docstring) - keeps upgrades to a container restart, no manual
      # `psql` step needed.
      - ./db/migrations:/app/db/migrations:ro
    ports:
      - "8080:8080"
    networks:
      - internal

networks:
  internal:

volumes:
  db-data:
