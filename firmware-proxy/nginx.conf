# Reverse proxy in front of the `esphome` service (the official ESPHome
# dashboard/device builder), used solely so the main app's Firmware tab
# can embed it in an iframe with a matching dark theme - without touching
# the esphome/esphome image itself.
#
# Why a separate proxy/port instead of proxying under the main app's own
# path (e.g. /firmware/proxy/)? The device builder's frontend is a
# root-mounted SPA - it calls absolute paths like /api/... and /ws (built
# from window.location.host, not a configurable base path), which would
# collide with the main app's own /api/* routes if proxied under the same
# origin/port. Giving it its own dedicated port sidesteps that entirely.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Firmware compiles can take a while and build logs stream over the
    # WebSocket for the duration - keep long-lived connections alive.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 64m;

    location / {
        proxy_pass http://esphome:6052;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (build/flash log streaming).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Ask the upstream not to gzip so sub_filter below can rewrite the
        # plain-text HTML response.
        proxy_set_header Accept-Encoding "";

        # The device builder's own CSP disallows inline <script>/<style>,
        # which is exactly how the theme override just below is applied -
        # drop it for this proxied copy only (the upstream app's own auth
        # still applies; this doesn't change what a logged-in user can do,
        # just relaxes script-source restrictions on the page itself).
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;

        sub_filter_once on;
        sub_filter '<head>' '<head><script>
      // Force the device builder into its own dark theme regardless of
      // this browser or OS actual color-scheme preference, by making its
      // startup check (matchMedia("(prefers-color-scheme: dark)")) always
      // report dark. Runs before app.js (deferred scripts execute after
      // this inline one) so it wins the race with the app own init.
      (function () {
        var real = window.matchMedia && window.matchMedia.bind(window);
        if (!real) return;
        window.matchMedia = function (query) {
          if (typeof query === "string" && query.indexOf("prefers-color-scheme") !== -1 && query.indexOf("dark") !== -1) {
            return {
              matches: true, media: query, onchange: null,
              addListener: function () {}, removeListener: function () {},
              addEventListener: function () {}, removeEventListener: function () {},
              dispatchEvent: function () { return true; },
            };
          }
          return real(query);
        };
      })();
    </script><style>
      /* Re-point the device builder own theme tokens (see its
         :root block) at this dashboard palette instead of overriding
         its ~400 underlying design tokens directly - these few are the
         documented single knob it already exposes for embedding. */
      :root {
        --primary-color: #58a6ff !important;
        --text-primary-color: #0d1117 !important;
        --success-color: #3fb950 !important;
        --warning-color: #d29922 !important;
        --error-color: #f85149 !important;
        --disabled-text-color: #8b949e !important;
      }
    </style>';
    }
}
